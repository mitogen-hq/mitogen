- name: integration/package_manager/list.yml
  hosts: test-targets
  become: false
  gather_facts: true
  vars:
    ansible_python_interpreter: "{{ pkg_mgr_python_interpreter }}"
    package: rsync  # Chosen to exist in all tested distros/package managers
  tasks:
    - name: Test dnf list call
      dnf:
        list: "{{ package }}"
      when:
        - ansible_facts.pkg_mgr == 'dnf'
  tags:
    - issue_1558
