# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Tests

# env:
#  ANSIBLE_VERBOSITY: 3
#  MITOGEN_LOG_LEVEL: DEBUG

on:
  pull_request:
  push:
    branches-ignore:
      - docs-master

# https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners
# https://github.com/actions/runner-images/blob/main/README.md#software-and-image-support
jobs:
  olde:
    name: olde ${{ matrix.tox_env }}
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: py27-m_ans-ans2.10
          - tox_env: py27-m_ans-ans4

          - tox_env: py36-m_ans-ans2.10
          - tox_env: py36-m_ans-ans4

          - tox_env: py27-m_mtg
          - tox_env: py36-m_mtg

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          key: ${{ matrix.tox_env }}-${{ hashFiles('tests/ansible/requirements.txt', 'tests/requirements-tox.txt', 'tests/requirements.txt') }}
          path: |
            ~/.cache/pip
            ~/.pyenv/versions
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: .ci/show_python_versions
      - run: .ci/setup_ssh_key_mitogen__has_sudo_pubkey
      - run: .ci/setup_sudoers_defaults
        if: ${{ contains(matrix.tox_env, 'm_mtg') }}
      - name: Install deps
        id: install-deps
        run: |
          set -o errexit -o nounset -o pipefail
          source .ci/bash_functions
          PY_VER="$(toxenv-pyver '${{ matrix.tox_env }}')"

          sudo apt-get update
          sudo apt install --no-install-recommends --yes "${OS_DEPS[@]}"

          if [[ $PY_VER == "2.7" ]]; then
              PYTHON="$HOME/.pyenv/versions/2.7.18/bin/python2.7"
          elif [[ $PY_VER == "3.6" ]]; then
              PYTHON="$HOME/.pyenv/versions/3.6.15/bin/python3.6"
          fi

          if [[ ! -x $PYTHON ]]; then
            sudo apt install --no-install-recommends --yes "${PY_BUILD_DEPS[@]}"
            curl --fail --silent --show-error --location https://pyenv.run | bash
            ~/.pyenv/bin/pyenv install "$PY_VER"
            "$PYTHON" -m pip install -r "tests/requirements-tox.txt"
          fi

          echo "python=$PYTHON" >> $GITHUB_OUTPUT
      - name: Create environments
        run: |
          set -o errexit -o nounset -o pipefail
          PYTHON="${{ steps.install-deps.outputs.python }}"
          "$PYTHON" -m tox --notest -e "${{ matrix.tox_env }}"
      - name: Run tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          PYTHON="${{ steps.install-deps.outputs.python }}"

          "$PYTHON" -m tox --skip-pkg-install -e "${{ matrix.tox_env }}"

  u2404:
    name: u2404 ${{ matrix.tox_env }}
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: py311-m_ans-ans2.10
            python_version: '3.11'
          - tox_env: py311-m_ans-ans3
            python_version: '3.11'
          - tox_env: py311-m_ans-ans4
            python_version: '3.11'
          - tox_env: py311-m_ans-ans5
            python_version: '3.11'
          - tox_env: py313-m_ans-ans6
            python_version: '3.13'
          - tox_env: py313-m_ans-ans7
            python_version: '3.13'
          - tox_env: py313-m_ans-ans8
            python_version: '3.13'
          - tox_env: py314-m_ans-ans9
            python_version: '3.14'
          - tox_env: py314-m_ans-ans10
            python_version: '3.14'
          - tox_env: py314-m_ans-ans11
            python_version: '3.14'
          - tox_env: py314-m_ans-ans12
            python_version: '3.14'
          - tox_env: py314-m_ans-ans13
            python_version: '3.14'
          - tox_env: py314-m_ans-ans14
            python_version: '3.14'

          - tox_env: py314-m_ans-ans14-s_lin
            python_version: '3.14'

          - tox_env: py315-m_mtg
            python_version: '3.15.0-rc.1'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: |
            tests/ansible/requirements.txt
            tests/requirements-tox.txt
            tests/requirements.txt
          python-version: ${{ matrix.python_version }}
        if: ${{ matrix.python_version }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: .ci/show_python_versions
      - run: .ci/setup_ssh_key_mitogen__has_sudo_pubkey
      - run: .ci/setup_sudoers_defaults
        if: ${{ contains(matrix.tox_env, 'm_mtg') }}
      - name: Install deps
        id: install-deps
        run: |
          set -o errexit -o nounset -o pipefail
          source .ci/bash_functions
          PYTHON="python$(toxenv-pyver '${{ matrix.tox_env }}')"

          sudo apt-get update
          sudo apt install --no-install-recommends --yes "${OS_DEPS[@]}"

          "$PYTHON" -m pip install -r "tests/requirements-tox.txt"
          echo "python=$PYTHON" >> $GITHUB_OUTPUT
      - name: Create environments
        run: |
          set -o errexit -o nounset -o pipefail
          PYTHON="${{ steps.install-deps.outputs.python }}"
          "$PYTHON" -m tox --notest -e "${{ matrix.tox_env }}"
      - name: Run tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          PYTHON="${{ steps.install-deps.outputs.python }}"

          "$PYTHON" -m tox --skip-pkg-install -e "${{ matrix.tox_env }}"

  macos:
    name: macos ${{ matrix.tox_env }}
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
    runs-on: macos-15
    timeout-minutes: 10
    env:
      MITOGEN_TEST_SKIP_CONTAINER_TESTS: 1

    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: py314-m_lcl-ans14
            python_version: '3.14'
          - tox_env: py314-m_lcl-ans14-s_lin
            python_version: '3.14'

          - tox_env: py315-m_mtg
            python_version: 3.15.0-rc.1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: |
            tests/ansible/requirements.txt
            tests/requirements-tox.txt
            tests/requirements.txt
          python-version: ${{ matrix.python_version }}
        if: ${{ matrix.python_version }}
      - run: .ci/show_python_versions
      - run: .ci/install_sshpass ${{ matrix.sshpass_version }}
        if: ${{ matrix.sshpass_version }}
      - run: .ci/setup_ssh_key_localhost
        if: ${{ contains(matrix.tox_env, 'm_lcl') }}
      - run: .ci/setup_ssh_key_mitogen__has_sudo_pubkey
      - run: .ci/setup_sudoers_defaults
        if: ${{ contains(matrix.tox_env, 'm_mtg') }}
      - name: Install deps
        id: install-deps
        run: |
          set -o errexit -o nounset -o pipefail
          source .ci/bash_functions
          PYTHON="python$(toxenv-pyver '${{ matrix.tox_env }}')"

          "$PYTHON" -m pip install -r "tests/requirements-tox.txt"
          echo "python=$PYTHON" >> $GITHUB_OUTPUT
      - name: Create environments
        run: |
          set -o errexit -o nounset -o pipefail
          PYTHON="${{ steps.install-deps.outputs.python }}"
          "$PYTHON" -m tox --notest -e "${{ matrix.tox_env }}"
      - name: Run tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          PYTHON="${{ steps.install-deps.outputs.python }}"

          "$PYTHON" -m tox --skip-pkg-install -e "${{ matrix.tox_env }}"

  # https://github.com/marketplace/actions/alls-green
  check:
    if: always()
    needs:
      - olde
      - u2404
      - macos
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
